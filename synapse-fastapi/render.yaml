services:
  - type: web
    name: synapse-fastapi
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BEDROCK_CHAT_MODEL_ID
        value: amazon.nova-micro-v1:0
      - key: BEDROCK_ROADMAP_MODEL_ID
        value: amazon.nova-micro-v1:0
      - key: BEDROCK_FEEDBACK_MODEL_ID
        value: amazon.nova-lite-v1:0
      - key: AWS_S3_BUCKET_NAME
        value: synapse-ai-summaries
      - key: OLLAMA_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: qwen3:8b
